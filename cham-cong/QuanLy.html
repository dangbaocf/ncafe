    h+='<p style="margin:12px 0 4px"><b>IP gặp gần đây khi chấm công</b> (30 ngày)</p>'+(r.gan.length?'<div class="scroll"><table><tr><th>IP</th><th>Quét ở quán</th><th class="n">Số lần</th><th class="n">Người</th><th class="n">Đúng vị trí quán</th><th class="n">Bị chặn</th><th>Lần cuối</th><th></th></tr>'+r.gan.map(function(g){ var qs=Object.keys(g.quan).sort(function(a,b){ return g.quan[b]-g.quan[a]; }), cs=qs[0]||'';

      h+='<span style="min-width:260px;flex:1"><label style="font-size:12px;color:#6B6460">'+ten+help+dauSua+' <span class="sub" style="font-size:11px">· '+esc(k.Key)+'</span></label>'+ctl+'</span>';
    });
    h+='</div><button class="btn" data-cdd1Luu="'+g[0]+'" style="margin-top:8px">Lưu '+esc(g[1])+'</button></details>';
  });
  h+='<details class="hs"><summary><b>📝 Nhật ký sửa (D1)</b></summary><div id="cdD1Nk"><p class="sub">Bấm để tải…</p><button class="mini" onclick="taiCDD1NK()">Tải 100 dòng gần nhất</button></div></details>';
  box.innerHTML=h;
  box.querySelectorAll('[data-cdd1Luu]').forEach(function(b){ b.onclick=function(){ var nhom=b.dataset.cdd1Luu, kv={};
    box.querySelectorAll('[data-cdd1]').forEach(function(i){ var k=i.dataset.cdd1, def=(r.keys[nhom]||[]).find(function(x){ return x.Key===k; }); if(def) kv[k]=i.value; });
    b.disabled=true; b.textContent='Đang lưu…';
    cfD1('ghi', {kv:kv, lyDo:'UI đợt A'}).then(function(x){ b.disabled=false; b.textContent='Lưu '+(({bimat:'Mã bí mật',wifi:'Wi-Fi',nguong:'Ngưỡng',com:'Cơm',luong:'Lương',tg:'Telegram',bt:'Bảng tin',luutru:'Lưu trữ / ảnh',xeplich:'Xếp lịch',khac:'Khác'})[nhom]||nhom);
      if(x.body.ok){ baoNhanh('Đã lưu '+(x.body.doi||0)+' khoá'+(x.body.loi&&x.body.loi.length?' · '+x.body.loi.length+' lỗi':'')); if(x.body.loi&&x.body.loi.length) alert('Lỗi:\n- '+x.body.loi.join('\n- ')); taiCDD1(); }
      else alert('Lỗi: '+(x.body.msg||'không rõ'));
    }).catch(function(e){ b.disabled=false; alert('Lỗi mạng: '+e.message); }); }; }); }
function taiCDD1NK(){ var box=$('cdD1Nk'); if(!box) return; box.innerHTML='<p class="sub">Đang tải…</p>';
  cfD1('nhat-ky', {gioiHan:100}).then(function(x){ if(!x.body.ok){ box.innerHTML='<p style="color:#B4382F">'+esc(x.body.msg||'')+'</p>'; return; }

    box.innerHTML='<div class="scroll"><table><tr><th>Lúc</th><th>Ai</th><th>Bảng</th><th>Khoá</th><th>Cũ</th><th>Mới</th><th>Lý do</th></tr>'+x.body.ds.map(function(k){ return '<tr><td class="sub">'+esc(k.Luc)+'</td><td>'+esc(k.Boi)+'</td><td>'+esc(k.Bang)+'</td><td><code>'+esc(k.Khoa)+'</code></td><td>'+esc(k.Cu)+'</td><td><b>'+esc(k.Moi)+'</b></td><td class="sub">'+esc(k.LyDo||'')+'</td></tr>'; }).join('')+'</table></div>';
  }); }

/* (29/10) Tải lại 1 khung: giữ nội dung cũ, làm mờ + nhãn "Đang tải…" (không xoá trắng); xong / lỗi thì bỏ mờ */
function hopTai(id){ var b=document.getElementById(id); if(!b) return; if(b.children.length && !/^\s*Đang tải/.test(b.textContent||'')) b.classList.add('hopTai'); else b.innerHTML='<p class="sub">Đang tải…</p>'; }
function hopXong(id){ var b=document.getElementById(id); if(b) b.classList.remove('hopTai'); }
function hopLoi(id, e){ var b=document.getElementById(id); if(!b) return; b.classList.remove('hopTai'); b.insertAdjacentHTML('afterbegin','<p style="color:#B4382F">Chưa tải được (mạng): '+String(e&&e.message||e).replace(/</g,'&lt;')+'</p>'); }

/* (29/10) Lương riêng theo khoảng ngày cho từng người (Nhân sự → 📅 Lương theo ngày) */
document.addEventListener('click',function(e){ var b=e.target && e.target.closest && e.target.closest('[data-lk]'); if(!b) return; e.preventDefault(); moLK(b.dataset.lk); });
function moLK(ma){ var box=$('lkBox'); if(!box){ box=document.createElement('div'); box.id='lkBox'; box.className='hs'; box.style.cssText='border:2px solid #C9A27A;background:#FFFBF5;margin:0 0 12px'; $('view').insertBefore(box,$('view').firstChild); }
  box.innerHTML='<p class="sub">Đang tải…</p>'; box.scrollIntoView({behavior:'smooth',block:'start'});
  google.script.run.withSuccessHandler(function(r){ if(!r.ok){ box.innerHTML='<p class="bad">'+esc(r.msg)+'</p>'; return; } veLK(r); }).withFailureHandler(function(e){ box.innerHTML='<p class="bad">Lỗi: '+esc(e.message||e)+'</p>'; }).dsLuongKhoang({pin:PIN,maNV:ma}); }
function veLK(r){ var box=$('lkBox'), t=today(), d=function(x){ return x.split('-').reverse().join('/'); };
  var h='<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>📅 Lương theo ngày – '+esc(r.ten)+' ('+r.ma+')</b><button class="mini" id="lkDong">← Quay lại</button></div>'
    +(r.codinh?'<p class="sub">Người này hưởng <b>lương cố định</b> – lương riêng theo ngày chỉ áp cho lương giờ.</p>':'<p class="sub">Mức thường hiện nay: <b>'+String(r.thuong).replace('.',',')+'k/giờ</b>. Trong khoảng ngày đặt dưới đây, giờ làm tính theo mức riêng; <b>hết khoảng tự về mức thường</b>. Áp cho bảng lương, phiếu lương, tra cứu.</p>');
  h+=r.list.length?'<table style="margin:6px 0"><tr><th>Khoảng ngày</th><th>Mức</th><th>Ghi chú</th><th></th></tr>'+r.list.map(function(x){ return '<tr><td>'+d(x.Tu)+' → '+d(x.Den)+(x.Den<t?' <span class="sub">(đã qua)</span>':(x.Tu<=t?' <span class="pill ok">đang áp dụng</span>':''))+'</td><td><b>'+(x.Kieu==='heso'?'× '+String(x.GiaTri).replace('.',','):String(x.GiaTri).replace('.',',')+'k/giờ')+'</b></td><td>'+esc(x.GhiChu)+'</td><td><button class="mini" data-lkxoa="'+x.ID+'">Xoá</button></td></tr>'; }).join('')+'</table>':'<p class="sub">Chưa có khoảng lương riêng nào.</p>';
  if(!r.codinh) h+='<div class="bar" style="margin-top:6px"><div><label>Từ ngày</label><input type="date" id="lkTu" value="'+t+'"></div><div><label>Đến ngày</label><input type="date" id="lkDen"></div>'
    +'<div><label>Kiểu</label><select id="lkKieu"><option value="gio">Lương giờ (k/giờ)</option><option value="heso">Hệ số (× mức thường)</option></select></div><div><label id="lkNhan">Lương giờ (k)</label><input id="lkGT" inputmode="decimal" placeholder="VD 28" style="width:90px"></div>'
    +'<div style="flex:1;min-width:160px"><label>Ghi chú</label><input id="lkGC" placeholder="VD thử việc, làm Tết, kèm người mới" style="width:100%;text-align:left"></div><button class="btn" id="lkLuu">Lưu</button></div><div class="sub" id="lkMsg"></div>';
  box.innerHTML=h; $('lkDong').onclick=function(){ box.remove(); };
  box.querySelectorAll('[data-lkxoa]').forEach(function(b){ b.onclick=function(){ if(!confirm('Xoá khoảng lương riêng này? Giờ làm trong khoảng đó sẽ tính lại theo mức thường.')) return; google.script.run.withSuccessHandler(function(x){ if(!x.ok){ alert(x.msg); return; } RUN_CACHE={}; moLK(r.ma); }).xoaLuongKhoang({pin:PIN,id:b.dataset.lkxoa}); }; });
  if(r.codinh) return;
  $('lkKieu').onchange=function(){ var hs=this.value==='heso'; $('lkNhan').textContent=hs?'Hệ số (×)':'Lương giờ (k)'; $('lkGT').placeholder=hs?'VD 1,2':'VD 28'; };
  $('lkLuu').onclick=function(){ var b=this; b.disabled=true; $('lkMsg').textContent='Đang lưu…';
    google.script.run.withSuccessHandler(function(x){ b.disabled=false; if(!x.ok){ $('lkMsg').innerHTML='<span class="bad">'+esc(x.msg)+'</span>'; return; } RUN_CACHE={}; baoNhanh('Đã lưu lương riêng '+x.moTa); moLK(r.ma); })
      .withFailureHandler(function(e){ b.disabled=false; $('lkMsg').textContent='Lỗi: '+(e.message||e); }).luuLuongKhoang({pin:PIN,maNV:r.ma,tu:$('lkTu').value,den:$('lkDen').value,kieu:$('lkKieu').value,giaTri:String($('lkGT').value).replace(',','.'),ghiChu:$('lkGC').value}); }; }

/* (30/10) Bảng tin trong trang quản lý (Cài đặt → Thông báo sự kiện) */
var BTQL={url:'',t:'',luc:0};
function btQLMo(){ var o=$('btQL'); if(!o) return; var dung=function(){ o.innerHTML='<iframe id="btQLk" title="Bảng tin Ncafe" src="'+BTQL.url+'/bangtin?embed=1&t='+encodeURIComponent(BTQL.t)+'" style="width:100%;height:'+Math.round(window.innerHeight*0.8)+'px;border:1px solid #EBDDC2;border-radius:14px;display:block;background:transparent"></iframe>'; };
  if(BTQL.t && Date.now()-BTQL.luc<6*3600e3){ dung(); return; }
  google.script.run.withSuccessHandler(function(x){ if(!x || !x.ok){ o.innerHTML='<p class="sub">'+esc(x&&x.msg||'Chưa mở được bảng tin')+'</p>'; return; } BTQL={url:x.url,t:x.t,luc:Date.now()}; dung(); })
   .withFailureHandler(function(e){ o.innerHTML='<p class="bad">Lỗi: '+esc(e.message||e)+'</p>'; }).bangTinQL({pin:PIN}); }
window.addEventListener('message',function(e){ var d=e.data; if(!d || d.type!=='ncafe-bangtin-height') return; var f=$('btQLk'); if(!f) return; var g=(String(BTQL.url).match(/^https?:\/\/[^\/]+/)||[''])[0]; if(g && e.origin!==g) return;
  f.style.height=(d.h==='full'?Math.round(window.innerHeight*0.8):Math.min(Math.max(+d.h||0,80),900))+'px'; });

/* (30/10) SỐ ĐỎ trên tiêu đề tab: việc chưa xử lý (Hôm nay · Xác nhận giờ · Báo hư hỏng · Lương · Nhân sự). Cập nhật khi đăng nhập, 2 phút / lần, khi đổi tab */
var SOVIEC={so:{},ct:{},luc:0,dang:false};
function apSoViec(){ document.querySelectorAll('#tabs .tab').forEach(function(b){ var g=b.dataset.g, n=+(SOVIEC.so[g]||0), bd=b.querySelector('.bd');
  if(n>0){ if(!bd){ bd=document.createElement('span'); bd.className='bd'; b.appendChild(bd); } bd.textContent=n>99?'99+':String(n); b.title=(SOVIEC.ct[g]||'')+' (cập nhật '+(SOVIEC.lucTxt||'')+')'; }
  else { if(bd) bd.remove(); b.removeAttribute('title'); } }); }
function capNhatSo(ep){ if(!PIN || SOVIEC.dang) return; if(!ep && Date.now()-SOVIEC.luc<30000) return; SOVIEC.dang=true;
  google.script.run.withSuccessHandler(function(x){ SOVIEC.dang=false; if(!x || !x.ok) return; SOVIEC.so=x.so||{}; SOVIEC.ct=x.ct||{}; SOVIEC.luc=Date.now(); SOVIEC.lucTxt=x.luc; apSoViec(); })
   .withFailureHandler(function(){ SOVIEC.dang=false; }).demViec({pin:PIN}); }
setInterval(function(){ if(!document.hidden) capNhatSo(true); }, 120000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) capNhatSo(false); });
document.addEventListener('click', function(e){ if(e.target.closest && e.target.closest('#tabs .tab, #subtabs .tabcon')) setTimeout(function(){ capNhatSo(false); }, 1500); });
