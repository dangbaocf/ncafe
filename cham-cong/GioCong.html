<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#EDF0EF;color:#24160F;padding:16px;max-width:560px;margin:0 auto;line-height:1.45}
h1{font-size:21px;font-weight:800}.sub{color:#6B6460;font-size:13px}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:12px}
.lbl{font-size:13px;color:#6B6460;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid #D5DBD9;border-radius:12px;background:#F6F7F6;color:#24160F}
.btn{font:inherit;font-weight:700;font-size:16px;width:100%;padding:13px;border-radius:14px;border:0;background:#6B4226;color:#fff;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid #D5DBD9;background:#fff;color:#24160F}
.chip.on{background:#2F5D62;border-color:#2F5D62;color:#fff}.chip:disabled{opacity:.45}
.tong{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.o{background:#FFF1C2;border:1px solid #F0D98A;border-radius:12px;padding:7px 12px;min-width:110px;flex:1 1 110px}.o div:first-child{font-size:12px;color:#6B5A2E}.o div:last-child{font-size:19px;font-weight:800}
/* Máy tính / màn hình rộng: trang giãn ra, ngày công xếp 2–3 cột (điện thoại giữ 1 cột như cũ) */
@media (min-width:860px){ body{max-width:1000px;padding:22px 26px} h1{font-size:24px} .dsNgay{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px} .dsNgay>div{margin-top:0!important} .tong .o{flex:0 1 170px} #th{max-width:260px} }
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}th,td{border-bottom:1px solid #E5E5E5;padding:6px 4px;text-align:left}th{color:#6B6460;font-size:12px}td.n,th.n{text-align:right}
.err{color:#B4382F;font-size:14px;margin-top:8px}.hide{display:none}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.nav a,.nav button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid #D5DBD9;background:#fff;color:#24160F;text-decoration:none;cursor:pointer}
.nav a.on{background:#6B4226;border-color:#6B4226;color:#fff}.nav button{color:#B4382F;border-color:#E8C4BF;margin-left:auto}
.tudong #dn{display:none!important} #dangMo{display:none;text-align:center;padding:36px 10px;color:#6B6460;font-size:15px} .tudong #dangMo{display:block}
</style></head><body><script>/* có vé phiên (từ trang kia) hoặc mã đã nhớ → ẩn khung đăng nhập NGAY từ đầu, hiện "Đang mở…" (không chớp khung đăng nhập) */try{ var _c=/[#&]s=/.test(location.hash||''); try{ _c=_c||(localStorage.getItem('ncafe_ma')&&localStorage.getItem('ncafe_sdt4'))||localStorage.getItem('ncafe_phien'); }catch(e){} if(_c) document.documentElement.className+=' tudong'; }catch(e){}</script>
<h1>Giờ công của tôi</h1><p class="sub">Ncafe – giờ công từng ngày, hiện ngay khi quản lý duyệt.</p><div id="nav"></div>
<div class="card" id="dn"><div class="lbl">Mã nhân viên</div><input id="ma" inputmode="numeric"><div class="lbl">4 số cuối điện thoại</div><input id="sdt" inputmode="numeric" maxlength="4"><button class="btn" onclick="xem()">Xem giờ công</button><p class="err" id="err"></p></div>
<div id="dangMo">⏳ Đang mở giờ công…</div><div class="card hide" id="kq"></div>
<script>
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hm(x){ return String(Math.round((+x||0)*100)/100).replace('.',','); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
var TH=null, DOT=0, R=null; if(ls('ncafe_ma')) $('ma').value=ls('ncafe_ma'); if(ls('ncafe_sdt4')) $('sdt').value=ls('ncafe_sdt4');
function doiVe(){ var h=String(location.hash||'').replace(/^#/,''), q={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); else if(kv) q[kv]=1; });
  if(q.s||q.hong||q.t){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } return q; }
var VE=doiVe(), PHIEN=VE.s||ls('ncafe_phien')||'';
// đăng nhập: gõ mã + 4 số (hoặc mã đã nhớ) → dùng mã; không có thì dùng vé phiên
function idNV(){ var m=$('ma').value.trim(), s=$('sdt').value.trim(); return (m && (s || !PHIEN))?{ma:m, sdt4:s}:{phien:PHIEN}; }
function veNav(){ var v=PHIEN?'#s='+PHIEN:''; $('nav').innerHTML='<div class="nav"><a href="/lich-cua-toi'+v+'" target="_self">📅 Lịch của tôi</a><a href="/gio-cong" class="on" onclick="return false">⏱ Giờ công của tôi</a><a href="/lich-cua-toi'+(v?v+'&t=hong':'#t=hong')+'" target="_self">🛠 Báo hư hỏng</a><button onclick="dangXuat()">Đăng xuất</button></div>'; }
function dangXuat(){ try{ localStorage.removeItem('ncafe_ma'); localStorage.removeItem('ncafe_sdt4'); localStorage.removeItem('ncafe_phien'); }catch(e){} PHIEN=''; R=null; $('ma').value=''; $('sdt').value=''; $('nav').innerHTML=''; $('kq').classList.add('hide'); $('kq').innerHTML=''; $('dn').classList.remove('hide'); }
function xem(th){ $('err').textContent=''; var id=idNV(); google.script.run.withSuccessHandler(function(r){ document.documentElement.classList.remove('tudong'); if(!r.ok){ $('nav').innerHTML=''; if(r.hetPhien){ PHIEN=''; try{ localStorage.removeItem('ncafe_phien'); }catch(e){} } $('err').textContent=r.msg; $('dn').classList.remove('hide'); return; }
    R=r; TH=r.thang; if(r.phien){ PHIEN=r.phien; ls('ncafe_phien',r.phien); } if(id.ma){ ls('ncafe_ma',r.maNV); ls('ncafe_sdt4',$('sdt').value.trim()); } $('dn').classList.add('hide'); veNav(); ve(); })
  .withFailureHandler(function(e){ document.documentElement.classList.remove('tudong'); $('dn').classList.remove('hide'); $('err').textContent='Lỗi: '+(e.message||e); }).gioCongCuaToi(id.ma?{maNV:id.ma,sdt4:id.sdt4,thang:th||TH}:{phien:id.phien,thang:th||TH}); }
function ve(){ var r=R, CS={}; r.stores.forEach(function(s){ CS[s.MaCS]=s.TenCS; });
  var h='<b>'+esc(r.ten)+'</b> <span class="sub">('+r.maNV+')</span><div class="lbl">Tháng</div><input type="month" id="th" value="'+r.thang+'">';
  h+='<div class="chips"><button class="chip'+(DOT===0?' on':'')+'" data-d="0">Cả tháng</button>'+r.dots.map(function(d){ return '<button class="chip'+(DOT===d.Dot?' on':'')+'" data-d="'+d.Dot+'">Đợt '+d.Dot+' ('+d.Nhan+')'+(d.DaDuyet?' ✓':'')+'</button>'; }).join('')+'</div>';
  var ca=r.ca.filter(function(c){ if(!DOT) return true; var d=r.dots[DOT-1]; return c.Ngay>=d.Tu && c.Ngay<=d.Den; }), da=ca.filter(function(c){ return c.DaDuyet; });
  var gio=0, ngay={}, cs={}; da.forEach(function(c){ gio+=c.Gio; ngay[c.Ngay]=1; cs[c.MaCS]=cs[c.MaCS]||{g:0,n:{}}; cs[c.MaCS].g+=c.Gio; cs[c.MaCS].n[c.Ngay]=1; });
  h+='<div class="tong"><div class="o"><div>Ngày đã duyệt</div><div>'+Object.keys(ngay).length+'</div></div><div class="o"><div>Giờ đã duyệt</div><div>'+hm(gio)+'</div></div><div class="o"><div>Chờ duyệt</div><div>'+(ca.length-da.length)+' ca</div></div>'+Object.keys(cs).map(function(k){ return '<div class="o"><div>'+esc(CS[k]||k)+'</div><div>'+Object.keys(cs[k].n).length+' ngày · '+hm(cs[k].g)+'h</div></div>'; }).join('')+'</div>';
  if(!ca.length) h+='<p class="sub" style="margin-top:10px">Chưa có ngày công nào trong khoảng này.</p>';
  h+='<div class="dsNgay">'+ca.slice().reverse().map(function(c){ var ph=c.PhanHoi;
    return '<div style="border:1px solid #D5DBD9;border-radius:12px;padding:9px 11px;margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+c.Ngay.slice(8)+'/'+c.Ngay.slice(5,7)+' · '+esc(CS[c.MaCS]||c.MaCS)+'</b>'+(c.DaDuyet?'<b style="color:#2E7D5B">✓ '+hm(c.Gio)+'h</b>':'<span class="sub">'+(c.TrangThai==='Đang làm'?'đang làm':'chờ quản lý duyệt')+'</span>')+'</div>'
      +'<div class="sub">Ca '+c.Ca+' · chấm '+c.Vao+'–'+(c.Ra||'?')+(c.Tre?' · '+c.Tre:'')+'</div>'
      +(c.SuaKhac?'<div class="sub" style="color:#9A6212">Quản lý điều chỉnh ('+esc(c.Cach)+')'+(c.LyDoSua?': '+esc(c.LyDoSua):'')+'</div>':'')
      +(ph?'<div class="sub">Bạn phản hồi: "'+esc(ph.NoiDung)+'"'+(ph.TraLoi?' → Quản lý: '+esc(ph.TraLoi):' · chờ trả lời')+'</div>':'')
      +(c.ChoPhanHoi?'<div style="margin-top:6px"><button class="chip" data-ph="'+c.ID+'">Giờ này chưa đúng? Phản hồi</button></div>':'')+'</div>'; }).join('')+'</div>';
  h+='<p class="sub" style="margin-top:8px">Giờ hiện ngay khi quản lý duyệt. Sai thì bấm Phản hồi trong '+r.hanPhanHoi+' ngày. Đợt có dấu ✓ đã khoá sổ.</p>';
  $('kq').innerHTML=h; $('kq').classList.remove('hide');
  $('th').onchange=function(){ DOT=0; xem($('th').value); };
  $('kq').querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ DOT=+b.dataset.d; ve(); }; });
  $('kq').querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ var nd=prompt('Giờ công ngày này sai ở đâu? (VD: em đến 6h30, quên chấm)'); if(!nd) return;
    b.disabled=true; google.script.run.withSuccessHandler(function(x){ b.disabled=false; alert(x.ok?(x.trung?x.msg:'Đã gửi phản hồi cho quản lý.'):x.msg); if(x.ok) xem(); }).withFailureHandler(function(e){ b.disabled=false; alert('Lỗi mạng: '+(e&&e.message||e)); }).phanHoi(Object.assign(idNV(),{ccId:b.dataset.ph,noiDung:nd})); }; }); }
if((ls('ncafe_ma') && ls('ncafe_sdt4')) || PHIEN){ veNav(); setTimeout(function(){ xem(); },0); } else document.documentElement.classList.remove('tudong');
</script></body></html>
