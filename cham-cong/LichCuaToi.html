<style>

.nav a.on{background:#6B4226;border-color:#6B4226;color:#fff}.nav button{color:#B4382F;border-color:#E8C4BF;margin-left:auto;font-size:12.5px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.tudong #dn{display:none!important} #dangMo{display:none;text-align:center;padding:36px 10px;color:#6B6460;font-size:15px} .tudong #dangMo{display:block}
</style></head><body><script>/* có vé phiên (từ trang kia) hoặc mã đã nhớ → ẩn khung đăng nhập NGAY từ đầu, hiện "Đang mở…" (không chớp khung đăng nhập) */try{ var _c=/[#&]s=/.test(location.hash||''); try{ _c=_c||(localStorage.getItem('ncafe_ma')&&localStorage.getItem('ncafe_sdt4'))||localStorage.getItem('ncafe_phien'); }catch(e){} if(_c) document.documentElement.className+=' tudong'; }catch(e){}</script>
<h1>Lịch của tôi</h1><p class="sub">Ncafe – xem lịch, xin phép, báo quên chấm, đăng ký bận, nhận ca, báo hư hỏng.</p><div id="nav"></div>
<div class="card" id="dn"><div class="lbl">Mã nhân viên</div><input class="input" id="ma" inputmode="numeric"><div class="lbl">4 số cuối điện thoại (nếu hồ sơ đã có số)</div><input class="input" id="sdt" inputmode="numeric" maxlength="4"><button class="btn" id="vao">Xem</button><p class="err" id="e0"></p></div>
<div id="dangMo">⏳ Đang mở…</div><div id="app" class="hide"></div>
<script>
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
var DN=['CN','T2','T3','T4','T5','T6','T7'], R=null, TAB='bt', BAN={}, CS={}, ID={}, BT={tai:false, url:'', src:'', co:null, cho:null, len:false};   // BT (bảng tin) khai báo sớm: đoạn tự đăng nhập gọi veNav() ngay lúc mở trang
function dd(iso){ var d=new Date(iso+'T12:00:00+07:00'); return DN[d.getUTCDay()]+' '+iso.slice(8)+'/'+iso.slice(5,7); }
function days(d0){ var o=[]; for(var i=0;i<7;i++){ var d=new Date(new Date(d0+'T12:00:00+07:00').getTime()+i*864e5); o.push(d.toISOString().slice(0,10)); } return o; }
if(ls('ncafe_ma')) $('ma').value=ls('ncafe_ma'); if(ls('ncafe_sdt4')) $('sdt').value=ls('ncafe_sdt4');
$('vao').onclick=function(){ ID={ma:$('ma').value.trim(), sdt4:$('sdt').value.trim()}; tai(); };
if(location.hash==='#hong') TAB='hong'; else if(location.hash==='#lich') TAB='lich';
// thanh chuyển trang + đăng xuất (dùng chung đăng nhập với trang Giờ công)
// Chuyển trang NGAY TRONG KHUNG đang mở (không đổi địa chỉ trang), mang theo vé phiên → không phải đăng nhập lại
function veNav(){ var bt=(typeof BT==='object' && BT)?BT:{co:null}; if(TAB==='bt' && bt.co===false) TAB='lich';
  $('nav').innerHTML='<div class="nav">'+(bt.co===false?'':'<a href="/lich-cua-toi" class="'+(TAB==='bt'?'on':'')+'" data-nav="bt">📢 Bảng tin</a>')+'<a href="/lich-cua-toi#lich" class="'+(['bt','gio','hong'].indexOf(TAB)<0?'on':'')+'" data-nav="lich">📅 Lịch của tôi</a><a href="/gio-cong'+(PHIEN?'#s='+PHIEN:'')+'" class="'+(TAB==='gio'?'on':'')+'" data-nav="gio">⏱ Giờ công của tôi</a><a href="/lich-cua-toi#hong" class="'+(TAB==='hong'?'on':'')+'" data-nav="hong">🛠 Báo hư hỏng</a><button onclick="dangXuat()">Đăng xuất</button></div>';
  $('nav').querySelectorAll('[data-nav]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); TAB=a.dataset.nav; ve(); }; });
  try{ var on=$('nav').querySelector('a.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){} }
function dangXuat(){ try{ var bw=$('btWrap'); if(bw){ bw.remove(); } clearTimeout(BT.cho); BT={tai:false,url:'',src:'',co:null,cho:null,len:false}; sessionStorage.removeItem('nb_vao'); $('app').style.display=''; }catch(e){} try{ localStorage.removeItem('ncafe_ma'); localStorage.removeItem('ncafe_sdt4'); localStorage.removeItem('ncafe_phien'); }catch(e){} PHIEN=''; R=null; ID={}; $('ma').value=''; $('sdt').value=''; $('nav').innerHTML=''; $('app').classList.add('hide'); $('app').innerHTML=''; $('dn').classList.remove('hide'); }
function doiVe(){ var h=String(location.hash||'').replace(/^#/,''), q={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); else if(kv) q[kv]=1; });
  if(q.s||q.hong||q.t){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } return q; }
var VE=doiVe(), PHIEN=VE.s||ls('ncafe_phien')||'';
if(VE.t==='hong'||VE.hong) TAB='hong'; else if(VE.t==='gio' || /\/gio-cong\/?$/.test(location.pathname)) TAB='gio';   // địa chỉ /gio-cong mở cùng app, sẵn mục Giờ công
// mở trang: ưu tiên mã đã nhớ trên máy; không có thì dùng vé phiên mang theo từ trang kia
if(ls('ncafe_ma') && ls('ncafe_sdt4')){ ID={ma:ls('ncafe_ma'), sdt4:ls('ncafe_sdt4')}; veNav(); setTimeout(tai,0); }
else if(PHIEN){ ID={phien:PHIEN}; veNav(); setTimeout(tai,0); }
else document.documentElement.classList.remove('tudong');
// lưới an toàn: "Đang mở…" quá 25 giây → hiện lại ô đăng nhập + lời nhắn thử lại (không để trang đứng mãi)
setTimeout(function(){ if(document.documentElement.classList.contains('tudong') && !R){ document.documentElement.classList.remove('tudong'); $('dn').classList.remove('hide'); $('e0').textContent='Mở lâu quá (mạng chậm hoặc máy chủ đang bận). Bấm "Xem" để thử lại.'; } }, 25000);
function tai(){ if(TAB==='gio' && !GIO.r && !GIO.dang) taiGio(); if(TAB==='hong' && !HONGX) taiHong();
  google.script.run.withSuccessHandler(function(r){ document.documentElement.classList.remove('tudong'); if(!r.ok){ $('nav').innerHTML=''; if(ID.phien && !ID.ma){ PHIEN=''; try{ localStorage.removeItem('ncafe_phien'); }catch(e){} } $('e0').textContent=r.msg; $('dn').classList.remove('hide'); $('app').classList.add('hide'); return; }
  btNhan(r); R=r; CS={}; r.stores.forEach(function(s){ CS[s.MaCS]=s.TenCS; }); BAN={}; r.ban.forEach(function(b){ BAN[b.Ngay+'|'+b.Khoi]=1; });
  if(r.phien){ PHIEN=r.phien; ls('ncafe_phien',r.phien); } if(!GIO.r && !GIO.dang) setTimeout(function(){ taiGio(); }, 300); if(!HONGX) setTimeout(function(){ taiHong(); }, 600); if(ID.ma){ ls('ncafe_ma',r.ma); ls('ncafe_sdt4',ID.sdt4); } $('dn').classList.add('hide'); $('app').classList.remove('hide'); ve(); })
  .withFailureHandler(function(e){ document.documentElement.classList.remove('tudong'); $('dn').classList.remove('hide'); $('e0').textContent='Lỗi: '+(e.message||e); }).lichCuaToi(ID); }
/* ===== Mục "Giờ công của tôi" ngay trong trang (trước đây là trang riêng: phải tải lại trang + gọi máy chủ 2–4 giây) ===== */
var GIO={r:null, dang:false, th:'', dot:0, cho:null};
function hmG(x){ return String(Math.round((+x||0)*100)/100).replace('.',','); }
function taiGio(th, ve2){ GIO.dang=true; google.script.run.withSuccessHandler(function(r){ GIO.dang=false; if(!r.ok){ if(TAB==='gio') $('app').innerHTML='<div class="card"><p class="err">'+esc(r.msg)+'</p></div>'; return; }
    GIO.r=r; GIO.th=r.thang; GIO.luc=Date.now(); if(r.phien){ PHIEN=r.phien; }
    if(TAB==='gio' || ve2){ document.documentElement.classList.remove('tudong'); $('dn').classList.add('hide'); $('app').classList.remove('hide'); veNav(); veGio(); } })
  .withFailureHandler(function(e){ GIO.dang=false; if(TAB==='gio') $('app').innerHTML='<div class="card"><p class="err">Lỗi mạng: '+esc(e&&e.message||e)+' <button class="mini" onclick="taiGio(GIO.th,true)">Thử lại</button></p></div>'; })
  .gioCongCuaToi(ID.ma?{maNV:ID.ma,sdt4:ID.sdt4,thang:th||GIO.th||'',phien:''}:{phien:ID.phien||PHIEN,thang:th||GIO.th||''}); }
function veGio(){ var r=GIO.r; if(!r){ $('app').innerHTML='<div class="card"><p class="sub" style="text-align:center;padding:24px 0">⏳ Đang tải giờ công…</p></div>'; if(!GIO.dang) taiGio(); return; }
  var CSg={}, DOT=GIO.dot; r.stores.forEach(function(s){ CSg[s.MaCS]=s.TenCS; });
  var h='<div class="card"><b>'+esc(r.ten)+'</b> <span class="sub">('+r.maNV+')</span><div class="lbl">Tháng</div><input class="input" type="month" id="thG" value="'+r.thang+'">';
  h+='<div class="chips" style="margin-top:8px"><button class="chipG'+(DOT===0?' on':'')+'" data-d="0">Cả tháng</button>'+r.dots.map(function(d){ return '<button class="chipG'+(DOT===d.Dot?' on':'')+'" data-d="'+d.Dot+'">Đợt '+d.Dot+' ('+d.Nhan+')'+(d.DaDuyet?' ✓':'')+'</button>'; }).join('')+'</div>';
  var ca=r.ca.filter(function(c){ if(!DOT) return true; var d=r.dots[DOT-1]; return c.Ngay>=d.Tu && c.Ngay<=d.Den; }), da=ca.filter(function(c){ return c.DaDuyet; });
  var gio=0, ngay={}, cs={}; da.forEach(function(c){ gio+=c.Gio; ngay[c.Ngay]=1; cs[c.MaCS]=cs[c.MaCS]||{g:0,n:{}}; cs[c.MaCS].g+=c.Gio; cs[c.MaCS].n[c.Ngay]=1; });
  h+='<div class="tong"><div class="o"><div>Ngày đã duyệt</div><div>'+Object.keys(ngay).length+'</div></div><div class="o"><div>Giờ đã duyệt</div><div>'+hmG(gio)+'</div></div><div class="o"><div>Chờ duyệt</div><div>'+(ca.length-da.length)+' ca</div></div>'+Object.keys(cs).map(function(k){ return '<div class="o"><div>'+esc(CSg[k]||k)+'</div><div>'+Object.keys(cs[k].n).length+' ngày · '+hmG(cs[k].g)+'h</div></div>'; }).join('')+'</div>';
  if(!ca.length) h+='<p class="sub" style="margin-top:10px">Chưa có ngày công nào trong khoảng này.</p>';
  h+='<div class="dsNgay">'+ca.slice().reverse().map(function(c){ var ph=c.PhanHoi;
    return '<div class="ngC"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+c.Ngay.slice(8)+'/'+c.Ngay.slice(5,7)+' · '+esc(CSg[c.MaCS]||c.MaCS)+'</b>'+(c.DaDuyet?'<b style="color:#2E7D5B">✓ '+hmG(c.Gio)+'h</b>':'<span class="sub">'+(c.TrangThai==='Đang làm'?'đang làm':'chờ quản lý duyệt')+'</span>')+'</div>'
      +'<div class="sub">Ca '+c.Ca+(c.CaGio?' ('+(function(g){ var m=Math.round(g*60); return m%30===0?hmG(m/60)+'h':Math.floor(m/60)+'h'+('0'+(m%60)).slice(-2); })(c.CaGio)+')':'')+(c.TangCa?' <span style="display:inline-block;padding:0 7px;border-radius:999px;background:#E6F4EA;color:#1E6B43;font-size:12px">có tăng ca</span>':'')+(c.DiTre?' <span style="display:inline-block;padding:0 7px;border-radius:999px;background:#FDECEA;color:#B4382F;font-size:12px">đi trễ</span>':'')+'</div>'
       +(ph?'<div class="sub">📝 Ghi chú của bạn: "'+esc(ph.NoiDung)+'"'+(ph.TraLoi?'<br>💬 Quản lý: '+esc(ph.TraLoi):' · đang chờ quản lý xem')+'</div>':'')
       +(c.ChoPhanHoi?'<div style="margin-top:6px"><button class="chipG" data-ph="'+c.ID+'">📝 Ghi chú của bạn</button></div>':'')+'</div>'; }).join('')+'</div>';
  h+='<p class="sub" style="margin-top:8px">Giờ công hiện sau khi quản lý duyệt. Cần nhắn gì về ngày nào (VD ở lại thêm giờ), bấm <b>📝 Ghi chú của bạn</b> trong '+r.hanPhanHoi+' ngày. Đợt có dấu ✓ đã khoá sổ.</p></div>';
  $('app').innerHTML=h;
  $('thG').onchange=function(){ GIO.dot=0; GIO.r=null; veGio(); taiGio($('thG').value); };
  $('app').querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ GIO.dot=+b.dataset.d; veGio(); }; });
  $('app').querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ var nd=prompt('Ghi chú cho quản lý về ngày này (VD: em có ở lại thêm 30 phút, em quên chấm ra lúc 22h):'); if(!nd) return;
    b.disabled=true; google.script.run.withSuccessHandler(function(x){ b.disabled=false; alert(x.ok?(x.trung?x.msg:'Đã gửi ghi chú cho quản lý. Cảm ơn bạn!'):x.msg); if(x.ok) taiGio(GIO.th); }).withFailureHandler(function(e){ b.disabled=false; alert('Lỗi mạng: '+(e&&e.message||e)); }).phanHoi(Object.assign({},ID,{ccId:b.dataset.ph,noiDung:nd})); }; }); }
// mỗi lần mở lại mục Giờ công: hiện ngay bản đã có, đồng thời lấy bản mới ở nền
var PL='muon', HONG={muc:'Bình thường',photo:'',cs:''};
var MON=['Máy pha cà phê','Máy xay','Tủ lạnh / tủ đông','Máy lạnh','Máy in bill / POS','Điện','Nước','Bàn ghế','Ly / dụng cụ','Khác'];
// Báo hư hỏng: hiện NGAY (dùng bản đã lấy trước), danh sách mới tải ở nền; đang nhập dở thì không vẽ lại để khỏi mất chữ
var HONGX=null, HONGDANG=false;
function hongDangNhap(){ return HONG.mon || HONG.moTa || HONG.photo || ($('hMon')&&$('hMon').value) || ($('hMoTa')&&$('hMoTa').value); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='btBD'){ e.preventDefault(); datBD(); } });
// (29/10) Ngày lễ, sự kiện sắp tới (45 ngày)
function veSapToi(L){ if(!L || !L.length) return ''; var DN=['CN','T2','T3','T4','T5','T6','T7'], hom=new Date(); hom.setHours(12,0,0,0);
  var con=function(d){ var n=Math.round((new Date(d+'T12:00:00')-hom)/864e5); return n<=0?'<b style="color:#B4382F">hôm nay</b>':(n===1?'<b style="color:#B4382F">ngày mai</b>':'còn '+n+' ngày'); };
  return '<div class="card" style="background:#FFF8E6;border:1px solid #F0D98A"><b>📢 Sắp tới</b>'+L.map(function(x){ var d=new Date(x.Ngay+'T12:00:00');
    return '<div style="margin-top:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span style="min-width:74px;font-weight:700">'+DN[d.getDay()]+' '+x.Ngay.slice(8)+'/'+x.Ngay.slice(5,7)+(x.DenNgay?'–'+x.DenNgay.slice(8)+'/'+x.DenNgay.slice(5,7):'')+'</span><span>'+(x.Le?'🎉 ':'📌 ')+esc(x.Ten)+(x.GhiChu?' <span class="sub">· '+esc(x.GhiChu)+'</span>':'')+'</span><span class="sub" style="margin-left:auto">'+con(x.Ngay)+'</span></div>'; }).join('')+'</div>'; }
function datBD(){ var cu=(R&&R.bietDanh)||'', m=prompt('Biệt danh của bạn (chỉ bạn thấy – app dùng để chào bạn khi chấm công bằng điện thoại của bạn). Để trống để bỏ:', cu); if(m===null) return;
  google.script.run.withSuccessHandler(function(x){ if(!x.ok){ alert(x.msg); return; } R.bietDanh=x.bietDanh; ve(); }).withFailureHandler(function(e){ alert('Lỗi: '+(e.message||e)); }).datBietDanh(Object.assign({},ID,{bietDanh:m})); }
function veHong(){ if(HONGX) veHongVe(HONGX); else $('app').innerHTML='<div class="card"><p class="sub" style="text-align:center;padding:24px 0">⏳ Đang mở…</p></div>'; taiHong(); }
